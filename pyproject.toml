[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mousewheel"
version = "0.1.0"
description = "按住鼠标侧键弹出环形快捷菜单（Windows）"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6"]

[project.scripts]
mousewheel = "mousewheel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mousewheel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
